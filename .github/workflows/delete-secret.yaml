name: delete-secret
on:
  workflow_dispatch:
    inputs:
      name:
        description: "Env var name, e.g. STRIPE_KEY. Uppercase + underscores only."
        required: true
      preview:
        description: "If true, delete the preview override (uses <app>-preview-KEY)."
        type: boolean
        default: false
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  delete:
    uses: logiskbrist/logisk-platform-workflows/.github/workflows/delete-secret.yaml@v3
    with:
      name: ${{ inputs.name }}
      preview: ${{ inputs.preview }}
    secrets: inherit
