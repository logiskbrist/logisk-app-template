name: set-secret
on:
  workflow_dispatch:
    inputs:
      name:
        description: "Env var name, e.g. STRIPE_KEY. Uppercase + underscores only."
        required: true
      value:
        description: "The value. Never enter values you can't afford to log accidentally."
        required: true
      preview:
        description: "If true, this is a preview override (uses <app>-preview-KEY)."
        type: boolean
        default: false
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  set:
    uses: logiskbrist/logisk-platform-workflows/.github/workflows/set-secret.yaml@v3
    with:
      name: ${{ inputs.name }}
      value: ${{ inputs.value }}
      preview: ${{ inputs.preview }}
    secrets: inherit
