# Mirrors Key Vault secrets into k8s Secret `app-secret`, consumed via envFrom
# on the Deployment. Fully-separated environments — prod and preview pods see
# entirely disjoint sets of vars, no inheritance between them:
#
#   Prod pods see:     shared-prod-*      + PLACEHOLDER_APP-prod-*
#   Preview pods see:  shared-preview-*   + PLACEHOLDER_APP-preview-*
#
# Base (this file) defines the prod set; the preview overlay's kustomization
# JSON-patches this ExternalSecret to swap dataFrom to the preview set.
#
# Naming:
#   KV `shared-prod-PGHOST`                 → env var `PGHOST`      (customer-wide, platform-provisioned)
#   KV `shared-preview-PGHOST`              → env var `PGHOST` on preview pods
#   KV `PLACEHOLDER_APP-prod-STRIPE-KEY`    → env var `STRIPE_KEY`  (prod)
#   KV `PLACEHOLDER_APP-preview-STRIPE-KEY` → env var `STRIPE_KEY`  (preview)
#
# `/set-secret NAME VALUE`               writes PLACEHOLDER_APP-prod-NAME (prod-only).
# `/set-secret NAME VALUE -f preview=true` writes PLACEHOLDER_APP-preview-NAME (preview-only).
# There is no inheritance — you must set a preview value explicitly for previews to see it.
#
# The k8s Secret gets renamed to `pr-<N>-app-secret` in preview overlays by
# the ApplicationSet's `namePrefix: pr-{{ number }}-` — the Deployment's
# envFrom reference is auto-rewritten by kustomize, so nothing to patch here.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secret
spec:
  refreshInterval: 1m   # `/set-secret` writes to KV; ES pulls that into the k8s Secret. Long refresh
                        # windows cause "pod boots before secret arrives" races (better-auth crashes
                        # if AUTH_SECRET isn't populated at container start). 1m is safe — KV calls
                        # against a single vault at ~1 rps well under any quota.
  secretStoreRef:
    kind: SecretStore
    name: azure-keyvault-secret-store
  target:
    # target.name intentionally omitted — ESO defaults to metadata.name.
    # kustomize's namePrefix rewrites metadata.name (app-secret → pr-N-app-secret) but
    # NOT free-form string fields like spec.target.name. Omitting it lets the k8s
    # Secret track the ExternalSecret name, keeping prod and each preview isolated.
    creationPolicy: Owner
    deletionPolicy: Delete
  dataFrom:
    - find:
        name:
          regexp: "^shared-prod-.*"
      rewrite:
        - regexp:
            source: "^shared-prod-(.+)$"
            target: "$1"
        - regexp:
            source: "-"
            target: "_"
    - find:
        name:
          regexp: "^PLACEHOLDER_APP-prod-.*"
      rewrite:
        - regexp:
            source: "^PLACEHOLDER_APP-prod-(.+)$"
            target: "$1"
        - regexp:
            source: "-"
            target: "_"
